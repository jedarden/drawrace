---
# Dedicated ServiceAccounts for the drawrace workloads so credential access is
# bound to specific pod identities instead of the namespace-default SA.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: drawrace-api
  namespace: drawrace
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: drawrace-validator
  namespace: drawrace
---
# Read access to exactly the two Garage S3 credential secrets. resourceNames +
# get only: no list/watch (which cannot be name-restricted), no other secrets.
# The api and validator pods are the only identities in the namespace that can
# resolve the secretAccessKey; the default ServiceAccount resolves none.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: drawrace-s3-credentials-reader
  namespace: drawrace
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - drawrace-api-s3-credentials
      - drawrace-postgres-backup-s3
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: drawrace-api-s3-credentials-reader
  namespace: drawrace
subjects:
  - kind: ServiceAccount
    name: drawrace-api
    namespace: drawrace
roleRef:
  kind: Role
  name: drawrace-s3-credentials-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: drawrace-validator-s3-credentials-reader
  namespace: drawrace
subjects:
  - kind: ServiceAccount
    name: drawrace-validator
    namespace: drawrace
roleRef:
  kind: Role
  name: drawrace-s3-credentials-reader
  apiGroup: rbac.authorization.k8s.io
