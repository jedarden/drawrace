---
# ExternalSecrets sourcing the Garage S3 credentials from OpenBao.
#
# OpenBao is the single source of truth for the secretAccessKey: once the
# Garage operator issues the keys, scripts/populate-openbao-s3.sh writes them
# to the paths referenced below and these ExternalSecrets project the values
# into the drawrace namespace. No credential material ever lives in git.
#
# ClusterSecretStore `openbao` (Vault v2 KV at mount `secret`, Kubernetes auth
# role `external-secrets-rs-manager`) is managed by the
# external-secrets-ns-rs-manager ArgoCD app on rs-manager; the same store
# backs the synced ExternalSecrets in argocd/armor/cert-manager/external-dns.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: drawrace-api-s3-credentials
  namespace: drawrace
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: drawrace-api-s3-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: rs-manager/drawrace/s3
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: rs-manager/drawrace/s3
        property: AWS_SECRET_ACCESS_KEY
    - secretKey: AWS_ENDPOINT_URL
      remoteRef:
        key: rs-manager/drawrace/s3
        property: AWS_ENDPOINT_URL
    - secretKey: AWS_REGION
      remoteRef:
        key: rs-manager/drawrace/s3
        property: AWS_REGION
---
# Postgres backup credentials — the secretKey names must match the
# barmanObjectStore s3Credentials block in postgres-cluster.yaml
# (accessKeyId / secretAccessKey) and the GarageKey
# drawrace-postgres-backup-key secretName in garage-resources.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: drawrace-postgres-backup-s3
  namespace: drawrace
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: drawrace-postgres-backup-s3
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: rs-manager/drawrace/postgres-backup
        property: accessKeyId
    - secretKey: secretAccessKey
      remoteRef:
        key: rs-manager/drawrace/postgres-backup
        property: secretAccessKey
