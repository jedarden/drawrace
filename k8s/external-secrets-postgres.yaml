---
# ExternalSecret sourcing the DrawRace Postgres bootstrap credentials from
# OpenBao.
#
# CloudNativePG consumes this secret at cluster bootstrap: the Cluster in
# postgres-cluster.yaml sets initdb.secret.name = drawrace-postgres-credentials
# and the CNPG v1 CRD only generates credentials when that name is EMPTY, so
# the secret must exist before the Cluster first applies (populate-first
# ordering). The OpenBao path predates this manifest: KV v2
# rs-manager/drawrace/postgres has existed since 2026-06-27 (current version
# 3, keys username + password — verified 2026-09-07 via `bao kv metadata get`
# on the coding-agent read identity and the replicator's audit trail; the
# values themselves were never read). This manifest projects those values
# into the drawrace namespace for the operator to consume.
#
# ClusterSecretStore `openbao` (Vault v2 KV at mount `secret`, Kubernetes auth
# role `external-secrets-rs-manager`) is managed by the
# external-secrets-ns-rs-manager ArgoCD app on rs-manager; the same store
# backs the synced ExternalSecrets in argocd/armor/cert-manager/external-dns.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: drawrace-postgres-credentials
  namespace: drawrace
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: drawrace-postgres-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # Key names must match what the CNPG operator reads from the initdb
    # bootstrap secret (username / password) and what the OpenBao path
    # rs-manager/drawrace/postgres holds.
    - secretKey: username
      remoteRef:
        key: rs-manager/drawrace/postgres
        property: username
    - secretKey: password
      remoteRef:
        key: rs-manager/drawrace/postgres
        property: password
