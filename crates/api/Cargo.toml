[package]
name = "drawrace-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
deadpool-redis = "0.18"
redis = { version = "0.27", features = ["tokio-comp"] }
hmac = "0.12"
sha2 = "0.10"
aws-sdk-s3 = "1"
aws-config = "1"
hex = "0.4"
thiserror = "2"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustrict = "0.7"
# ipnet is already pulled in transitively (reqwest / metrics-exporter-prometheus);
# declaring it directly costs no extra compilation and gives us `IpNet::contains`
# for the staging-only per-IP rate-limit bypass (see `rate_limit_bypass`).
ipnet = "2"

[dev-dependencies]
axum-test = "16"
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "drawrace-api"
path = "src/main.rs"

[[bin]]
name = "generate-seed-ghosts"
path = "src/bin/generate-seed-ghosts.rs"
